name: AI Developer Agent

on:
  issues:
    types: [opened, edited]

jobs:
  ai-agent-refactor:
    if: contains(github.event.issue.labels.*.name, 'ai-code')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_AGENT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Tooling
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          OPENAI_API_BASE: https://azure.com
          OPENAI_API_KEY: ${{ secrets.AI_AGENT_TOKEN }}
          AIDER_MODEL: openai/gpt-4o
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Безопасный запуск через системные переменные окружения
          aider --yes --message "$ISSUE_TITLE. Подробности: $ISSUE_BODY"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.AI_AGENT_TOKEN }}
          commit-message: "🤖 Код скорректирован ИИ-агентом"
          title: "🤖 [ИИ-Агент] Правки по задаче"
          body: "ИИ выполнил корректировки кода на основе вашей команды в тикете. Проверьте вкладку Files changed."
          branch: ai-dynamic-refactoring
