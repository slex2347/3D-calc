name: 🤖 AI Developer Agent
on:
  issues:
    types: [opened, edited]

jobs:
  ai-agent-refactor:
    if: contains(github.event.issue.labels.*.name, 'ai-code')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Скачивание проекта
        uses: actions/checkout@v4
        with:
          token: \${{ secrets.AI_AGENT_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Установка ИИ-инструмента
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: 🧠 Автономное чтение и переписывание кода ИИ
        env:
          # Используем бесплатный встроенный ИИ-сервер GitHub для Actions
          OPENAI_API_BASE: https://azure.com
          OPENAI_API_KEY: \${{ secrets.AI_AGENT_TOKEN }}
          AIDER_MODEL: openai/gpt-4o
        run: |
          # Настройка подписи робота
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Агент получает текст вашей задачи, сам сканирует C# проект,
          # понимает связь с InputBox и вносит умные точечные правки
          aider --yes --message " github.event.issue.title . Подробное описание: {{ github.event.issue.body }}"

      - name: 📦 Отправка изменений в Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: \${{ secrets.AI_AGENT_TOKEN }}
          commit-message: "🤖 Код автоматически скорректирован ИИ-агентом"
          title: "🤖 [ИИ-Агент] Выполнены правки по задаче #\${{ github.event.issue.number }}"
          body: |
            Я полностью проанализировал ваш проект `PrintCalc3D` и выполнил корректировки на основе вашей команды:
            
            **"\${{ github.event.issue.title }}"**
            
            Пожалуйста, перейдите во вкладку **Files changed** выше, чтобы принять (`Merge`) или отклонить (`Close`) изменения.
          branch: ai-dynamic-refactoring
